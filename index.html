<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serve Receive Builder</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="brand">
      <h1>Serve Receive Builder</h1>
      <p class="subtitle">Volleyball formation designer</p>
    </header>

    <section class="control-group">
      <h2>System</h2>
      <div class="segmented" id="system-toggle" role="tablist">
        <button class="seg-btn active" data-value="5-1" role="tab">5-1</button>
        <button class="seg-btn" data-value="6-2" role="tab">6-2</button>
      </div>
    </section>

    <section class="control-group">
      <h2>Number of Passers</h2>
      <div class="segmented" id="passer-count">
        <button class="seg-btn" data-value="2">2</button>
        <button class="seg-btn active" data-value="3">3</button>
        <button class="seg-btn" data-value="4">4</button>
        <button class="seg-btn" data-value="5">5</button>
      </div>
    </section>

    <section class="control-group">
      <h2>Passers</h2>
      <div class="passer-checkboxes" id="passer-list"></div>
      <div class="warn" id="passer-warn"></div>
    </section>

    <section class="control-group">
      <h2>Roster Labels</h2>
      <div class="roster-labels" id="roster-labels"></div>
    </section>

    <section class="control-group">
      <h2>Display</h2>
      <label class="toggle-row">
        <input type="checkbox" id="hints-toggle" checked />
        <span>Show overlap hints</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="backrow-m-as-l-toggle" checked />
        <span>Show backrow M as L</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="spot-numbers-toggle" />
        <span>Show spot numbers</span>
      </label>
    </section>

    <section class="control-group">
      <h2>Share</h2>
      <div class="share-row">
        <button class="btn" id="copy-share-link">Copy Link</button>
      </div>
      <p class="hint share-hint">Includes current positions, labels, passers, and display options.</p>
      <div class="share-status" id="share-status" aria-live="polite"></div>
    </section>

    <section class="control-group">
      <h2>Export</h2>
      <div class="export-row">
        <button class="btn" id="export-png">PNG</button>
        <button class="btn" id="export-pdf">PDF</button>
        <button class="btn ghost" id="reset-btn">Reset Positions</button>
      </div>
    </section>

    <section class="control-group legend">
      <h2>Legend</h2>
      <ul>
        <li><span class="dot setter"></span> Setter</li>
        <li><span class="dot oh"></span> Outside Hitter</li>
        <li><span class="dot mb"></span> Middle Blocker</li>
        <li><span class="dot op"></span> Opposite</li>
        <li><span class="dot lib"></span> Libero</li>
        <li><span class="dot passer-ind"></span> Passer (ring)</li>
      </ul>
    </section>
  </aside>

  <main class="main">
    <div class="courts-grid" id="courts-grid"></div>
  </main>
</div>

<a class="github-link" href="https://github.com/timbergeron/sr" aria-label="GitHub repository" target="_blank" rel="noopener noreferrer">
  <i class="fa-brands fa-github" aria-hidden="true"></i>
</a>
<div class="mobile-swipe-cue" aria-label="Swipe right to view courts">
  <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
</div>

<script src="formation.js"></script>
<script src="court.js"></script>
<script src="app.js"></script>
</body>
</html>
